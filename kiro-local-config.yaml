# Hermes Agent — kiro-cli as Default Provider (claude-opus-4.6)
# =============================================================
# Uses kiro-cli (via OpenAI-compatible wrapper) as the sole LLM backbone.
# Model: claude-opus-4.6 (best quality, 1M context)
# TESTED AND WORKING: May 17, 2026

provider: custom
model: claude-opus-4.6

api_base: http://localhost:8000/v1
api_key: local

# ─── Model Configuration ──────────────────────────────────────────────────────

model:
  # Context window for Claude Opus 4.6 via kiro-cli (1M tokens!)
  context_length: 1000000
  # Max output tokens per response
  max_tokens: 32000
  provider: custom
  name: claude-opus-4.6
  base_url: http://localhost:8000/v1
  api_key: local

# ─── Agent Behavior ───────────────────────────────────────────────────────────

agent:
  # Higher iterations for opus (it's thorough)
  max_iterations: 60
  # API retry count (local = fast retries)
  api_max_retries: 2
  # Tool use enforcement
  tool_use_enforcement: auto

# ─── Memory Configuration ─────────────────────────────────────────────────────

memory:
  memory_enabled: true
  user_profile_enabled: true
  # Nudge interval (turns between memory save reminders)
  nudge_interval: 8
  # Character limits for memory files
  memory_char_limit: 3000
  user_char_limit: 2000

# ─── Compression Configuration ────────────────────────────────────────────────
# Optimized for local models where every token counts

compression:
  enabled: true
  # Trigger compression at 50% of context window
  threshold: 0.50
  # Target 20% of context after compression
  target_ratio: 0.20
  # Protect last N messages from compression
  protect_last_n: 15
  # Protect first N non-system messages
  protect_first_n: 2
  # Suppress status messages (cleaner output)
  status_messages: false

# ─── Microcompact (LLM-free context stripping) ────────────────────────────────
# Applied every turn BEFORE the API call — zero cost, instant

microcompact:
  enabled: true
  # Keep last N messages fully intact
  protect_last_n: 6
  # Truncate old tool results to this many chars (0 = remove entirely)
  max_tool_result_chars: 300
  # Strip <think>...</think> blocks from history
  strip_thinking: true
  # Remove trivial tool results ("ok", "done", etc.)
  strip_empty_tool_results: true

# ─── Skills Configuration ─────────────────────────────────────────────────────

skills:
  # Skill creation nudge interval
  creation_nudge_interval: 12
  # Don't inject full skills index (saves ~3.5k tokens per call)
  inject_index: false

# ─── Auxiliary Tasks ──────────────────────────────────────────────────────────
# All auxiliary tasks use the same local model (no separate cheap model)

auxiliary:
  compression:
    provider: custom
    model: claude-sonnet-4.6
    base_url: http://localhost:8000/v1
    api_key: local
    context_length: 200000
  vision:
    provider: custom
    model: claude-sonnet-4.6
    base_url: http://localhost:8000/v1
    api_key: local

# ─── MCP Strategy ─────────────────────────────────────────────────────────────
# kiro-cli already has MCP servers configured (Context7, arxiv, playwright,
# steelmind, tavily). These are available to the model during inference
# automatically — no duplicate config needed here.
#
# Only add servers to Hermes's MCP config if they need:
#   1. Persistent state across turns (knowledge graph, memory)
#   2. Deep integration with Hermes's tool hooks/interception
#   3. Custom result formatting for the skill/trajectory pipeline
#
# For stateless lookup servers (docs, search, web), let kiro-cli handle them.

# Uncomment to add Hermes-managed MCP servers (persistent connections):
# mcp_servers:
#   memory-graph:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-memory@latest"]
#     env: {}

# ─── Prompt Caching ───────────────────────────────────────────────────────────
# Disabled for local (kiro-cli manages its own caching)

prompt_caching:
  enabled: false

# ─── Security (Local-Only) ────────────────────────────────────────────────────

security:
  # Auto-approve all tool calls (trusted local environment)
  auto_approve_all: true
  # No command deny list (full local access)
  command_deny_list: []

# ─── Performance Optimizations ────────────────────────────────────────────────

performance:
  # Disable telemetry
  telemetry: false
  # Reduce tool delay (local = no rate limits)
  tool_delay: 0.1
  # Enable cache-stable mode for cron/automated tasks
  cache_stable: false
